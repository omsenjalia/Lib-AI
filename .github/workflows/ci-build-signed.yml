name: CI Build Signed APK

# Per-commit judge build. Publishes the raw `release.apk` ONLY — no zip, no
# AAB. (GitHub wraps Action *artifacts* in a .zip on download; anyone who wants
# a direct no-extract download should use the dated APK on the Releases page,
# published daily by nightly-release.yml.)
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Reading the repository is all this needs: it uploads an artifact and, on a
# tag, attaches to a release - both of which go through the token's default
# artifact/release APIs rather than needing write access to contents. Stated
# explicitly so the workflow runs with the least privilege it can, the same way
# the other four do.
permissions:
  contents: read

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          cache-key: flutter-3.44.0-stable
          pub-cache-key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache pub + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-apk-signed-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-apk-signed-
            ${{ runner.os }}-android-

      # fllama builds llama.cpp through a native-assets hook. The flag is set
      # defensively: a Flutter release that enables native assets by default
      # would otherwise fail here on an unknown option.
      - name: Configure toolchain
        run: flutter config --enable-native-assets || true

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — will sign with debug keys (dev fallback)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # llama.cpp is compiled from the vendored source inside the fllama
      # dependency on the first build, so this step is the slow one.
      #
      # Runner logs sit behind a short-lived SAS URL that cannot be read back
      # from outside, so a failure here would otherwise be invisible. The
      # output is echoed and posted to the PR, the same way ci-test.yml reports
      # analyze and test failures.
      - name: Build signed release APK
        id: build
        continue-on-error: true
        env:
          SIGNING_MODE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'signed' || 'debug-keys' }}
          KEYSTORE_PATH: android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          flutter build apk --release --no-obfuscate > build-output.txt 2>&1
          code=$?
          tail -c 60000 build-output.txt
          exit $code

      - name: Report build failures on the PR
        if: steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### `flutter build apk` — ${{ github.sha }}'
            echo '```'
            tail -c 60000 build-output.txt
            echo '```'
          } > build-comment.md
          gh pr comment "$PR_NUMBER" --body-file build-comment.md

      - name: Fail on build problems
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::flutter build apk reported failures"
          exit 1

      - name: Prepare APK artifact (release.apk only)
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk release.apk
          ls -la release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: library-ai-signed-${{ github.sha }}
          path: release.apk
          retention-days: 30
