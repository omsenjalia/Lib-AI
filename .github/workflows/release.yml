name: Release APK

# Tag-triggered release. Push a tag like `v1.0.0` and this publishes a signed
# `release.apk` as a direct asset on a GitHub Release, alongside the notes for
# that tag.
#
# GitHub-only distribution on purpose: no Play Store setup, no AAB. The APK is
# installed by tapping the asset on the Releases page.
#
# If KEYSTORE_BASE64 is absent the build still succeeds, signed with the debug
# key, and the release notes say so — a judge build is better than a failed one,
# but nobody should mistake it for a production signature.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
          cache-key: flutter-3.44.0-stable
          pub-cache-key: flutter-pub-${{ hashFiles('**/pubspec.lock') }}

      - name: Cache pub + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-release-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-android-

      - name: Configure toolchain
        run: flutter config --enable-native-assets || true

      - name: Resolve the version being released
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Run the test suite before publishing
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter test --timeout 30s

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret — publishing a debug-key build."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          SIGNING_MODE: ${{ steps.keystore.outputs.has_keystore == 'true' && 'signed' || 'debug-keys' }}
          KEYSTORE_PATH: android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --no-obfuscate \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk release.apk
          ls -la release.apk

      - name: Publish GitHub Release (release.apk only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Library AI ${{ steps.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            Learn anywhere. No internet required.

            **Install:** download **`release.apk`** below directly onto your Android phone, tap it, and tap **Install** (enable "Install unknown apps" for your browser if prompted). No extraction needed.

            This release contains no model weights. Download a model from the app's Model Library screen once — after that the app works with no connection at all.

            ${{ steps.keystore.outputs.has_keystore == 'true' && 'Signed with the project release key.' || '**Note:** no release keystore was configured, so this build is signed with the debug key. It installs fine, but it cannot upgrade over a build signed with a different key.' }}
          files: release.apk
