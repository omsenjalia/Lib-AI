org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# fllama builds llama.cpp through a native assets build hook (hook/build.dart),
# which is why the heap above is 8 GB instead of the template default. Jetifier
# is off because nothing here depends on a pre-AndroidX support library; leaving
# it on would make every build rewrite dependency bytecode for no reason.
android.enableJetifier=false
# Build cache makes up-to-date Gradle tasks replayable from ~/.gradle/caches,
# which the CI workflows already persist; parallel helps the multi-module
# Android side on the runners.
org.gradle.caching=true
org.gradle.parallel=true
